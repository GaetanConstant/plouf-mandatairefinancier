[project]
name = "mandataire-financier-backend"
version = "0.1.0"
description = "Backend for the campaign finance management application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "duckdb>=0.9.2",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "pyocclient>=0.6.0",
    "openpyxl>=3.1.2",
    "fpdf2>=2.7.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
