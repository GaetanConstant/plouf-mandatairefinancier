[project]
name = "mandataire-financier-backend"
version = "0.1.0"
description = "Backend for the campaign finance management application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "pyocclient>=0.6.0",
    "openpyxl>=3.1.2",
    "fpdf2>=2.7.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.16.5",
    "weasyprint>=66.0",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.2.1",
    # OCR des justificatifs (ocr_utils) : exige tesseract-ocr-fra et poppler-utils.
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "pillow>=12.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
