name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe uv
        uses: astral-sh/setup-uv@v5

      - name: Suite de tests backend
        working-directory: backend
        run: uv run --with pytest pytest -q

      - name: Build du frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      # Le déploiement est mis en sommeil tant que les secrets ne sont pas
      # posés : sans ce garde-fou, chaque push laisse `main` en échec alors que
      # la mise en production est volontairement suspendue. L'étape se
      # réactive d'elle-même le jour où SERVER_HOST existe.
      - name: Vérifie que le déploiement est configuré
        id: gate
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "actif=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets de déploiement absents — déploiement ignoré."
          else
            echo "actif=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déploie sur la VM
        if: steps.gate.outputs.actif == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/mandatairefinancier
            git fetch origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            # Laisse le temps aux migrations Alembic de s'appliquer au démarrage.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3305/api/health > /dev/null; then
                echo "Déploiement OK"
                exit 0
              fi
              sleep 2
            done
            echo "Healthcheck en échec après 60 s"
            docker compose logs --tail=50
            exit 1
