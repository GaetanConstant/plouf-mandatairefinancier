server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les noms d'assets portent un hash : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html jamais mis en cache, sinon un déploiement reste invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API : relais vers uvicorn (même origine, donc cookies de session valides).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # SPA : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
